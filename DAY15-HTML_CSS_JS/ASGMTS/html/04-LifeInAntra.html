<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04-LifeInAntra</title>
  <style>
    table {
      border: 1px solid black;
    }

    th:first-of-type {

    }

      vertical-align: middle;
      width: 100px;
      height: 100px;
      border: 1px solid black;
    }

    table table td {
      width: 90px;
      height: 40px;
    }

    .top-left {

    }

    .top-center {
      text-align: center;

    }

    .top-right {
      text-align: right;
      vertical-align: top;
    }

    .center-left {
      text-align: left;
      vertical-align: middle;
    }

    .center-center {
      text-align: center;
      vertical-align: middle;
    }

    .center-right {
      text-align: right;
      vertical-align: middle;
    }

    .bottom-left {
      text-align: left;
      vertical-align: bottom;
    }

    .bottom-center {
      text-align: center;
      vertical-align: bottom;
    }

    .bottom-right {
      text-align: right;
      vertical-align: bottom;
    }

</head>

</html>
