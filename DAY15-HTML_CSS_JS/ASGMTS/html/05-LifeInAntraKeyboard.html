<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05-LifeInAntraKeyboard</title>
  <style>
    table {
      border: 1px solid black;
    }

    th:first-of-type button{
      font-size: xx-large;
      border-radius: 5px;
    }

    td {
      text-align: center;
      vertical-align: middle;
      width: 100px;
      height: 100px;
      border: 1px solid black;
      padding: 5px;
    }

    table table {
      border: none;
    }

    table table td {
      width: 90px;
      height: 40px;
      border: none;
    }

    button {
      width: 100%;
      height: 100%;
      color: blue;
      border: none;
      background: linear-gradient(to bottom, #e4e4e4 50%, #cfcfcf 50%);
      cursor: pointer;
    }

    th button {
      background: none;
      background-color: #f2eded;
    }

    .center-right {
      text-align: right;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <table>
    <thead>
      <tr>
        <th colspan="4">
          <button>Antra Life</button>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="2"><button type="button">GOOGLE</button></td>
        <td colspan="2"><button type="button">GitHub</button></td>
      </tr>
      <tr>
        <td><button type="button">Facebook</button></td>
        <td><button type="button">GMail</button></td>
        <td><button type="button">YouTube</button></td>
        <td><button type="button">2048</button></td>
      </tr>
      <tr>
        <td><button type="button">Food</button></td>
        <td colspan="2"><button type="button">Games</button></td>
        <td>
          <table>
            <tr>
              <td><button type="button">Social Life</button></td>
            </tr>
            <tr>
              <td><button type="button">Sleep</button></td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td colspan="3"><button type="button" class="center-right">Beer&gt;&gt;&gt;</button></td>
        <td><button type="button">WC</button></td>
      </tr>
    </tbody>
  </table>
</body>

</html>
